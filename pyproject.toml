[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-planner"
version = "0.1.0"
description = "Planejamento bibliográfico interativo antes da coleta de fontes"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["ruff==0.16.9"]

[project.scripts]
research-planner = "research_planner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
extend-exclude = ["user", "runs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
